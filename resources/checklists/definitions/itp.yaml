# resources/checklists/definitions/itp.yaml

schema_version: 1
code: ITP
title: ИТП
description: Индивидуальный тепловой пункт.
source_workbook: Чек-лист ИТП.xlsx
expected_question_count: 75
sheets:
- id: main
  title: 1. ОЛ ИТП
  sections:
  - id: main-section-1
    title: Сведения о Заказчике
    questions:
    - id: main-1
      source_number: '1'
      text: Какая организация указана ?
      output_order: 1
      label: 'Организация:'
    - id: main-2
      source_number: '2'
      text: Какой юридический или почтовый адрес организации указан?
      output_order: 2
      label: 'Адрес:'
    - id: main-3
      source_number: '3'
      text: Какой ИНН организации указан ?
      output_order: 3
      label: 'ИНН:'
    - id: main-4
      source_number: '4'
      text: Какой контактный номер телефона указан?
      output_order: 4
      label: 'Телефон:'
    - id: main-5
      source_number: '5'
      text: Какой адрес электронной почты для связи указан?
      output_order: 5
      label: 'E-mail:'
    - id: main-6
      source_number: '6'
      text: Какое наименование проектируемого объекта указано?
      output_order: 6
      label: 'Наименование объекта:'
    - id: main-7
      source_number: '7'
      text: Какой точный адрес местонахождения объекта указан?
      output_order: 7
      label: 'Адрес объекта:'
  - id: main-section-2
    title: Сведения о потреблении тепловой энергии
    questions:
    - id: main-8
      source_number: '8'
      text: Какая максимальная тепловая нагрузка на систему отопления указана Qмакс в кВт или Гкал/ч?
      output_order: 8
      label: 'Система отопления:'
    - id: main-9
      source_number: '9'
      text: Какая максимальная и средняя тепловая нагрузка на систему горячего водоснабжения указана Qмакс.ч и Qср.ч в кВт
        или Гкал/ч?
      output_order: 9
      label: 'Система ГВС:'
    - id: main-10
      source_number: '10'
      text: Какая максимальная тепловая нагрузка на систему вентиляции указана Qмакс в кВт или Гкал/ч?
      output_order: 10
      label: 'Система вентиляции:'
    - id: main-11
      source_number: '11'
      text: Какая максимальная тепловая нагрузка на технологические нужды указана Qмакс в кВт или Гкал/ч?
      output_order: 11
      label: 'Технологические нужды:'
    - id: main-12
      source_number: '12'
      text: Какая общая суммарная тепловая нагрузка указана Qмакс в кВт или Гкал/ч?
      output_order: 12
      label: 'Общая тепловая нагрузка:'
  - id: main-section-3
    title: Сведения об источнике теплоснабжения
    questions:
    - id: main-13
      source_number: '13'
      text: Какой источник теплоснабжения указан (ТЭЦ, котельная или прочее)?
      output_order: 13
      label: 'Источник теплоснабжения:'
    - id: main-14
      source_number: '14'
      text: Какие параметры подающего трубопровода Т1 указаны (температура °C зима/лето, диаметр ДУ, давление Р1 в кгс/см²
        или МПа)?
      output_order: 14
      label: 'Параметры тепловой сети (Подающий трубопровод Т1):'
    - id: main-15
      source_number: '15'
      text: Какие параметры обратного трубопровода Т2 указаны (температура °C зима/лето, диаметр ДУ, давление Р2 в кгс/см²
        или МПа)?
      output_order: 15
      label: 'Параметры тепловой сети (Обратный трубопровод Т2):'
    - id: main-16
      source_number: '16'
      text: Какой вариант УУТЭ на вводе указан (Да, Нет, Существующий)?
      output_order: 16
      label: 'Узел учета тепловой энергии (на вводе):'
  - id: main-section-4
    title: Требования к модулю системы отопления (СО)
    questions:
    - id: main-17
      source_number: '17'
      text: Какой тип подключения системы отопления указан (независимое или зависимое)?
      output_order: 17
      label: 'Тип подключения:'
    - id: main-18
      source_number: '18'
      text: Какой тип теплообменника для СО указан (паяный или разборный)?
      output_order: 18
      label: 'Тип теплообменника СО:'
    - id: main-19
      source_number: '19'
      text: Какое резервирование ПТО для СО указано (2×100%, 2×50%, нет или другое)?
      output_order: 19
      label: 'Резервирование ПТО для СО:'
    - id: main-20
      source_number: '20'
      text: Какой расчетный температурный график СО указан (Т1, °C и Т2, °C)?
      output_order: 20
      label: 'Температурный график СО:'
    - id: main-21
      source_number: '21'
      text: Какие максимальные потери давления в СО указаны (в кгс/см² или м.в.ст.)?
      output_order: 21
      label: 'Максимальные потери давления в СО:'
    - id: main-22
      source_number: '22'
      text: Какое рабочее давление отопительных приборов указано (в кгс/см² или м.в.ст.)?Каково рабочее давление отопительных
        приборов в системе (в кгс/см² или м.в.ст.)?
      output_order: 22
      label: 'Рабочее давление отопительных приборов:'
    - id: main-23
      source_number: '23'
      text: Какой статический напор системы отопления указан (в метрах)?
      output_order: 23
      label: 'Статический напор системы отопления:'
    - id: main-24
      source_number: '24'
      text: Какой расчетный или фактический объем системы отопления указан (в литрах или м3).
      output_order: 24
      label: 'Объем системы отопления:'
    - id: main-25
      source_number: '25'
      text: Резервирование циркуляционного насоса для СО указано (Да / Нет)?
      output_order: 25
      label: 'Насос СО (Резервирование):'
    - id: main-26
      source_number: '26'
      text: Сдвоенный циркуляционный насос для СО указан (Да / Нет)?
      output_order: 26
      label: 'Насос СО (Сдвоенный):'
    - id: main-27
      source_number: '27'
      text: Частотное регулирование для насоса СО указано (Да / Нет)?
      output_order: 27
      label: 'Насос СО (Частотное регулирование):'
  - id: main-section-5
    title: Требования к модулю горячего водоснабжения (ГВС)
    questions:
    - id: main-28
      source_number: '28'
      text: Какое конструктивное исполнение ГВС указано (с теплообменником, с водонагревателем или открытая система)?
      output_order: 28
      label: 'Тип ГВС:'
    - id: main-29
      source_number: '29'
      text: Какой тип теплообменника для ГВС указан (паяный или разборный)?
      output_order: 29
      label: 'Тип теплообменника ГВС:'
    - id: main-30
      source_number: '30'
      text: Какое резервирование пластинчатого теплообменника требуется для ГВС (2 шт. по 100%, 2 шт. по 50%, нет или другое)?
      output_order: 30
      label: 'Резервирование ПТО для ГВС:'
    - id: main-31
      source_number: '31'
      text: Какая схема подключения теплообменника указана (двухступенчатая параллельная/последовательная/моноблок или одноступенчатая)?
      output_order: 31
      label: 'Схема подключения теплообменника ГВС:'
    - id: main-32
      source_number: '32'
      text: Какой тип водонагревателя указан (электрический с ТЭНом, косвенного нагрева с ТО, комбинированный или бак-аккумулятор
        ГВС)?
      output_order: 32
      label: 'Тип водонагревателя (бойлера):'
    - id: main-33
      source_number: '33'
      text: Какой расход циркуляции ГВС указан (в % от максимального расхода)?
      output_order: 33
      label: 'Расход циркуляции ГВС:'
    - id: main-34
      source_number: '34'
      text: Какие максимальные потери давления в системе ГВС указаны (в кгс/см² или м.в.ст.)?
      output_order: 34
      label: 'Максимальные потери давления в системе ГВС:'
    - id: main-35
      source_number: '35'
      text: Какое минимальное давление ГВС на выходе из ИТП указано (в кгс/см² или м.в.ст.)?
      output_order: 35
      label: 'Давление ГВС на выходе:'
    - id: main-36
      source_number: '36'
      text: Какое давление ХВС на вводе в ИТП указано (в кгс/см² или м.в.ст.)?
      output_order: 36
      label: 'Давление ХВС на вводе:'
    - id: main-37
      source_number: '37'
      text: Резервирование циркуляционного насоса для ГВС указано (Да / Нет)?
      output_order: 37
      label: 'Насос ГВС (Резервирование):'
    - id: main-38
      source_number: '38'
      text: Сдвоенный циркуляционный насос для ГВС указан (Да / Нет)?
      output_order: 38
      label: 'Насос ГВС (Сдвоенный):'
    - id: main-39
      source_number: '39'
      text: Частотное регулирование для насоса ГВС указано (Да / Нет)?
      output_order: 39
      label: 'Насос ГВС (Частотное регулирование):'
  - id: main-section-6
    title: Требования к модулю системы вентиляции (СВ)
    questions:
    - id: main-40
      source_number: '40'
      text: Какой тип подключения системы теплоснабжения вентиляции указан (независимое или зависимое)?
      output_order: 40
      label: 'Тип подключения вентиляции:'
    - id: main-41
      source_number: '41'
      text: Какой тип теплообменника для СВ указан (паяный или разборный)?
      output_order: 41
      label: 'Тип теплообменника СВ:'
    - id: main-42
      source_number: '42'
      text: Какое резервирование пластинчатого теплообменника для СВ указано (2 шт. по 100%, 2 шт. по 50%, нет или другое)?
      output_order: 42
      label: 'Резервирование ПТО для СВ:'
    - id: main-43
      source_number: '43'
      text: Какой вид теплоносителя указан в системе вентиляции (Нет / Гликоль с указанием % / Этиленгликоль / Пропиленгликоль)?
      output_order: 43
      label: 'Теплоноситель СВ:'
    - id: main-44
      source_number: '44'
      text: Какой внутренний температурный график системы вентиляции указан (Т1,°C и Т2,°C)?
      output_order: 44
      label: 'Температурный график СВ:'
    - id: main-45
      source_number: '45'
      text: Какие максимальные потери давления в системе вентиляции указаны (в кгс/см² или м.в.ст.)?
      output_order: 45
      label: 'Максимальные потери давления в системе СВ:'
    - id: main-46
      source_number: '46'
      text: Какое рабочее давление вентиляционного оборудования указано (в кгс/см² или м.в.ст.)?
      output_order: 46
      label: 'Рабочее давление вент. оборудования:'
    - id: main-47
      source_number: '47'
      text: Какой статический напор системы вентиляции указан (в метрах)?
      output_order: 47
      label: 'Статический напор системы вентиляции: У'
    - id: main-48
      source_number: '48'
      text: Какой общий объем системы вентиляции указан (в литрах)?
      output_order: 48
      label: 'Объем системы вентиляции:'
    - id: main-49
      source_number: '49'
      text: Резервирование циркуляционного насоса для СВ указано (Да / Нет)?
      output_order: 49
      label: 'Насос СВ (Резервирование):'
    - id: main-50
      source_number: '50'
      text: Сдвоенный циркуляционный насос для СВ указан (Да / Нет)?
      output_order: 50
      label: 'Насос СВ (Сдвоенный):'
    - id: main-51
      source_number: '51'
      text: Частотное регулирование для насоса СВ указано (Да / Нет)?
      output_order: 51
      label: 'Насос СВ (Частотное регулирование):'
  - id: main-section-7
    title: Дополнительные опции и Габариты
    questions:
    - id: main-52
      source_number: '52'
      text: Какой канал диспетчеризации указан (GPRS/GSM, Ethernet, Modbus RS-485 или Другой) и для какой системы (УУТЭ или
        АТП) ?
      output_order: 52
      label: 'Канал диспетчеризации:'
    - id: main-53
      source_number: '53'
      text: Дистанционное управление указано (Да, с указанием типа канала связи / Нет)?
      output_order: 53
      label: 'Дистанционное управление:'
    - id: main-54
      source_number: '54'
      text: Какие габаритные размеры помещения ИТП указаны (Длина, Ширина, Высота в метрах)?
      output_order: 54
      label: 'Размеры помещения ИТП:'
    - id: main-55
      source_number: '55'
      text: Какие габариты монтажных проемов для заноса оборудования указаны (Длина, Ширина, Высота в метрах)?
      output_order: 55
      label: 'Монтажные проемы для заноса в ИТП:'
    - id: main-56
      source_number: '56'
      text: Какие любые дополнительные требования, примечания или текстовые сведения к проекту указаны ?
      output_order: 56
      label: 'Дополнительные сведения:'
    - id: main-57
      source_number: '57'
      text: Какие ФИО, должность и телефон ответственного лица указаны ?
      output_order: 57
      label: 'Ответственное лицо:'
- id: additional
  title: 1.1 Доп. вопросы ИТП
  sections:
  - id: additional-typical
    title: Типовые вопросы
    questions:
    - id: additional-typical-1
      source_number: '1'
      text: Какой необходимый объем предоставляемых услуг по ИТП указан?
      output_order: 1
    - id: additional-typical-2
      source_number: '2'
      text: Необходимость включения в объем поставки трубопроводной и кабельной обвязки между модулями ИТП указана?
      output_order: 3
    - id: additional-typical-3
      source_number: '3'
      text: Необходимость включения в объем поставки трубопроводной и кабельной обвязки с внешними сетями и внутренними коммуникациями
        указана?
      output_order: 5
    - id: additional-typical-4
      source_number: '4'
      text: Необходимость включения в объем поставки съемных термочехлов на оборудование и арматуру указана?
      output_order: 7
    - id: additional-typical-5
      source_number: '5'
      text: Какое заужение диаметров трубопроводов модулей ИТП по расчетной скорости теплоносителя допускается (переходы будут
        включены в объем поставки)?
      output_order: 9
    - id: additional-typical-6
      source_number: '6'
      text: Диспетчеризации параметров со шкафа учета указана (если да, то по какому каналу связи)?
      output_order: 11
    - id: additional-typical-7
      source_number: '7'
      text: Диспетчеризации параметров ИТП указаан (если да, то по какому каналу связи)?
      output_order: 13
  - id: additional-atypical
    title: Нетиповые вопросы
    questions:
    - id: additional-atypical-1
      source_number: '1'
      text: Установка общего шкафа и тепловычислителя для узла учета тепловой энергии и ГВС допускается (Да / Нет)?
      output_order: 2
    - id: additional-atypical-2
      source_number: '2'
      text: Наличие коллектора (гребенки) указано (Да / Нет)?
      output_order: 4
    - id: additional-atypical-3
      source_number: '3'
      text: Возможность объединения систем с одинаковыми внутренними температурными графиками в единый подогодависимый узел
        смешения с распределительным коллектором на выходе в рамках одного здания указаана?
      output_order: 6
    - id: additional-atypical-4
      source_number: '4'
      text: Необходимость включения в расчет ТКП морской упаковки модульных изделий указана?
      output_order: 8
    - id: additional-atypical-5
      source_number: '5'
      text: Вендор-лист поставщиков оборудования указан (при наличии — Да / Нет)?
      output_order: 10
    - id: additional-atypical-6
      source_number: '6'
      text: 'Какое давление ХВС p(B1) в месте присоединения к ИТП указано (в бар или МПа)?

        Какое давление Т3 в месте присоединения к ИТП указано (в бар или МПа)?

        Какое давление Т4 в месте присоединения к ИТП указано (в бар или МПа)?'
      output_order: 12
    - id: additional-atypical-7
      source_number: '7'
      text: Необходимость установки узлов учета тепловой энергии на выходе из каждой системы теплоснабжения (общие на всю
        систему теплоснабжения / на каждое ответвление на выходе из ЦТП) указана ?
      output_order: 14
    - id: additional-atypical-8
      source_number: '8'
      text: "*Если подпитка осуществляется не из обратного трубопровода тепловой сети. \nКакой состав исходной воды для подбора\
        \ хим. Водоподготовки указан ?"
      output_order: 15
    - id: additional-atypical-9
      source_number: '9'
      text: Применение оборудования, исполнение которого соответствует требованиям к строительству в северной строительно-климатической
        зоне подтверждено (Да / Нет)?
      output_order: 16
    - id: additional-atypical-10
      source_number: '10'
      text: Применение оборудования, исполнение которого соответствует требованиям к строительству на территории с сейсмичностью  превышающей
        7 баллов (по шкале MKS-64) подтверждено (Да / Нет)?
      output_order: 17
    - id: additional-atypical-11
      source_number: '11'
      text: Какие дополнительные требования площадки / проектного института при их наличии указаны?
      output_order: 18
